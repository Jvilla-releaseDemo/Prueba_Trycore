<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trycore Match</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
      color: #1f2937;
      background: #4d7eb0;
    }
    h1 { font-size: 1.6rem; }
    section { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    h2 { font-size: 1.05rem; margin-top: 0; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin: 10px 0 4px; }
    input, select {
      width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px;
      box-sizing: border-box; font-size: 0.9rem;
    }
    button {
      margin-top: 16px; padding: 10px 18px; border: none; border-radius: 6px;
      background: #2563eb; color: #fff; font-size: 0.95rem; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    pre { background: #111827; color: #e5e7eb; padding: 14px; border-radius: 8px; overflow-x: auto; }
    .error { color: #b91c1c; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Trycore Match</h1>
  <p>Evalúa la afinidad entre un candidato y una vacante.</p>

  <section>
    <h2>Candidato</h2>
    <label for="c-skills">Skills (separadas por coma)</label>
    <input id="c-skills" value="python, fastapi, docker">
    <label for="c-exp">Años de experiencia</label>
    <input id="c-exp" type="number" value="3" min="0">
  </section>

  <section>
    <h2>Vacante</h2>
    <label for="v-skills">Skills requeridas (separadas por coma)</label>
    <input id="v-skills" value="python, fastapi, sql">
    <label for="v-exp">Experiencia mínima</label>
    <input id="v-exp" type="number" value="2" min="0">
    <label for="v-contrato">Tipo de contrato</label>
    <select id="v-contrato">
      <option value="indefinido">Indefinido</option>
      <option value="obra_labor">Obra o labor</option>
      <option value="prestacion_servicios">Prestación de servicios</option>
    </select>
  </section>

  <button onclick="evaluar()">Evaluar match</button>

  <div id="resultado"></div>

  <script>
    async function evaluar() {
      const resultado = document.getElementById("resultado");
      const body = {
        candidato: {
          skills: document.getElementById("c-skills").value.split(",").map(s => s.trim()).filter(Boolean),
          experiencia_anios: parseInt(document.getElementById("c-exp").value, 10),
        },
        vacante: {
          skills_requeridas: document.getElementById("v-skills").value.split(",").map(s => s.trim()).filter(Boolean),
          experiencia_min: parseInt(document.getElementById("v-exp").value, 10),
          tipo_contrato: document.getElementById("v-contrato").value,
        },
      };
      try {
        const res = await fetch("/match", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) {
          resultado.innerHTML = `<p class="error">${JSON.stringify(data)}</p>`;
          return;
        }
        resultado.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
      } catch (err) {
        resultado.innerHTML = `<p class="error">Error de conexión: ${err}</p>`;
      }
    }
  </script>
</body>
</html>
